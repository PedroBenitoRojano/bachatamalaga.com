<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F8F5EF;
            --text-dark: #1A283B;
            --accent-orange: #EB5F2A;
            --shadow-soft: 0 40px 100px -20px rgba(235, 95, 42, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1080px;
            height: 1920px;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 180px 100px 140px 100px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -10%;
            width: 1200px;
            height: 1200px;
            background: radial-gradient(circle, rgba(235,95,42,0.08) 0%, rgba(248,245,239,0) 70%);
            z-index: -1;
        }
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        .logo-image { height: 280px; object-fit: contain; }
        .logo-text { text-align: center; line-height: 0.85; }
        .logo-text-bachata { font-family: 'Playfair Display', serif; font-style: italic; color: var(--accent-orange); font-size: 160px; letter-spacing: -2px; }
        .logo-text-malaga { font-family: 'Playfair Display', serif; color: var(--text-dark); font-size: 160px; letter-spacing: -2px; margin-top: 15px; }
        
        .signature {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 80px;
            color: var(--accent-orange);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="logo-section">
        <img src="logo.png" class="logo-image">
        <div class="logo-text">
            <h1 class="logo-text-bachata">Bachata</h1>
            <h2 class="logo-text-malaga">Málaga</h2>
        </div>
    </div>
    
    <div class="signature">
        ¡Nos vemos bailando!
    </div>
</body>
</html>
